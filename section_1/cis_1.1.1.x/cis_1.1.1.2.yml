---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_2 }}
command:
  modprobe_freevxfs:
    title: 1.1.1.2 | Ensure freevxfs kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+freevxfs\b'
    exit-status: 0
    stdout:
    - '/^blacklist freevxfs$/'
    - '/^install freevxfs (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.2
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_freevxfs:
    title: 1.1.1.2 | Ensure freevxfs kernel module is not available | not loaded
    path: /sys/module/freevxfs
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.2
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
