---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_3 }}
command:
  modprobe_hfs:
    title: 1.1.1.3 | Ensure hfs kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+hfs\b'
    exit-status: 0
    stdout:
    - '/^blacklist hfs$/'
    - '/^install hfs (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_hfs:
    title: 1.1.1.3 | Ensure hfs kernel module is not available | not loaded
    path: /sys/module/hfs
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
