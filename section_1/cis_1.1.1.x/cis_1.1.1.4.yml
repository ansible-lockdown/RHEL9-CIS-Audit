---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_4 }}
command:
  modprobe_hfsplus:
    title: 1.1.1.4 | Ensure hfsplus kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+hfsplus\b'
    exit-status: 0
    stdout:
    - '/^blacklist hfsplus$/'
    - '/^install hfsplus (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.4
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_hfsplus:
    title: 1.1.1.4 | Ensure hfsplus kernel module is not available | not loaded
    path: /sys/module/hfsplus
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.4
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
