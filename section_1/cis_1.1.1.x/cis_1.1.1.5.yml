---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_5 }}
command:
  modprobe_jffs2:
    title: 1.1.1.5 | Ensure jffs2 kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+jffs2\b'
    exit-status: 0
    stdout:
    - '/^blacklist jffs2$/'
    - '/^install jffs2 (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.5
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_jffs2:
    title: 1.1.1.5 | Ensure jffs2 kernel module is not available | not loaded
    path: /sys/module/jffs2
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID: 1.1.1.5
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
