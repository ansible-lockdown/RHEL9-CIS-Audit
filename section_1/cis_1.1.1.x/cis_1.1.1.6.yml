---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_6 }}
command:
  modprobe_overlay:
    title: 1.1.1.6 | Ensure overlay kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+overlay\b'
    exit-status: 0
    stdout:
    - '/^blacklist overlay$/'
    - '/^install overlay (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_overlay:
    title: 1.1.1.6 | Ensure overlay kernel module is not available | not loaded
    path: /sys/module/overlay
    exists: false
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
