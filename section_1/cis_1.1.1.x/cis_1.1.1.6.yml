---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_6 }}
command:
  overlay:
    title: 1.1.1.6 | Ensure overlay kernel module is not available
    exit-status: 0
    exec: "modprobe -n -v overlay | grep -E '(overlay|install)'"
    stdout:
    - install /bin/true
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  blacklist_overlay:
    title: 1.1.1.6 | Ensure overlay kernel module is not available | blacklist
    exit-status: 0
    exec: grep overlay /etc/modprobe.d/*.conf
    stdout:
      - '/blacklist overlay/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
