---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_7 }}
command:
  modprobe_squashfs:
    title: 1.1.1.7 | Ensure squashfs kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+squashfs\b'
    exit-status: 0
    stdout:
    - '/^blacklist squashfs$/'
    - '/^install squashfs (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.7
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_squashfs:
    title: 1.1.1.7 | Ensure squashfs kernel module is not available | not loaded
    path: /sys/module/squashfs
    exists: false
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.7
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
