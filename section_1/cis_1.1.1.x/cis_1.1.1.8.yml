---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_8 }}
command:
  modprobe_udf:
    title: 1.1.1.8 | Ensure udf kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+udf\b'
    exit-status: 0
    stdout:
    - '/^blacklist udf$/'
    - '/^install udf (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.8
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_udf:
    title: 1.1.1.8 | Ensure udf kernel module is not available | not loaded
    path: /sys/module/udf
    exists: false
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.8
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
