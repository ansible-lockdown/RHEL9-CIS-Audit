---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_1_9 }}
command:
  modprobe_firewire_core:
    title: 1.1.1.9 | Ensure firewire-core kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+firewire_core\b'
    exit-status: 0
    stdout:
    - '/^blacklist firewire_core$/'
    - '/^install firewire_core (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.9
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_firewire_core:
    title: 1.1.1.9 | Ensure firewire-core kernel module is not available | not loaded
    path: /sys/module/firewire_core
    exists: false
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.9
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
