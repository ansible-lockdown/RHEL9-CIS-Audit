---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_2_1_4 }}
mount:
  tmp_noexec_options:
    title: 1.1.2.1.4 | Ensure noexec option set on /tmp partition
    mountpoint: /tmp
    exists: true
    opts:
    - noexec
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.4
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
      CCI:
      - CCI-001764
file:
  {{ if .Vars.rhel9cis_tmp_svc }}
  tmp_noexec_unit_options:
    title: 1.1.2.1.4 | Ensure noexec option set on /tmp partition
    exists: true
    path: /etc/systemd/system/tmp.mount
    contents:
    - '/^Options=.*\bnoexec\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.4
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
      CCI:
      - CCI-001764
  {{ else }}
  tmp_noexec_fstab_options:
    title: 1.1.2.1.4 | Ensure noexec option set on /tmp partition
    exists: true
    path: /etc/fstab
    contents:
    - '/\s\/tmp.*noexec/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.4
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
      CCI:
      - CCI-001764
  {{ end }}
  {{ end }}
{{ end }}
