---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_2_6_4 }}
mount:
  var_log_noexec_options:
    title: 1.1.2.6.4 | Ensure noexec option set on /var/log partition
    mountpoint: '/var/log'
    exists: true
    opts:
    - noexec
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.6.4
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
file:
  var_log_noexec_fstab_options:
    title: 1.1.2.6.4 | Ensure noexec option set on /var/log partition
    exists: true
    path: /etc/fstab
    contents:
    - '/\s\/var\/log\s.*noexec/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.6.4
      NIST800-53R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
