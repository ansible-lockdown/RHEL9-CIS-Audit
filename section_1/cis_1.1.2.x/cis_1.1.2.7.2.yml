---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_1_2_7_2 }}
mount:
  var_log_audit_nodev_options:
    title: 1.1.2.7.2 | Ensure nodev option set on /var/log/audit partition
    skip: {{ not .Discovered.var_log_audit_mounted }}
    skip-reason: /var/log/audit is not a separate partition
    mountpoint: '/var/log/audit'
    exists: true
    opts:
    - nodev
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.7.2
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  var_log_audit_nodev_fstab_options:
    title: 1.1.2.7.2 | Ensure nodev option set on /var/log/audit partition
    skip: {{ not .Discovered.var_log_audit_mounted }}
    skip-reason: /var/log/audit is not a separate partition
    exists: true
    path: /etc/fstab
    contents:
    - '/\s\/var\/log\/audit\s.*nodev/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.7.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
