---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_2_1_3 }}
command:
  repo_gpgcheck_global:
    title: 1.2.1.3 | Ensure repo_gpgcheck is configured | global
    skip: {{ or (not .Vars.rhel9cis_enable_repogpg) .Vars.rhel9cis_rhel_default_repo }}
    skip-reason: repo_gpgcheck is not managed, rhel9cis_enable_repogpg is false or rhel9cis_rhel_default_repo is true
    exec: grep -Pi -- '^\h*repo_gpgcheck\h*=' /etc/dnf/dnf.conf
    timeout: {{ .Vars.timeout_ms }}
    exit-status: 0
    stdout:
    - '/(?i)^\s*repo_gpgcheck\s*=\s*(1|true|yes)\b/'
    - '!/(?i)^\s*repo_gpgcheck\s*=\s*(0|false|no)\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
