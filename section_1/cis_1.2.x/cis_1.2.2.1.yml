---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_2_2_1 }}
command:
  security-updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed | no pending updates
    skip: {{ not .Vars.run_heavy_tests }}
    skip-reason: heavy tests are off, run_heavy_tests is false
    exec: dnf check-update
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.2.1
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
