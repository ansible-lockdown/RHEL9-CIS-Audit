---

{{ if not .Vars.rhel9cis_selinux_disable }}
  {{ if .Vars.rhel9cis_level_1 }}
    {{ if .Vars.rhel9cis_rule_1_3_1_2 }}
command:
  selinux_disabled_boot:
    title: 1.3.1.2 | Ensure SELinux is not disabled in bootloader configuration
    exit-status: 1
    exec: 'grep "^\s*linux" /boot/grub2/grubenv | grep -E "(selinux|enforcing)=0"'
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
