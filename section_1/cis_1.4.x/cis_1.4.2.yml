---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_4_2 }}
file:
  grub_cfg_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | grub.cfg
    path: /boot/grub2/grub.cfg
    exists: true
    owner: root
    group: root
    mode: "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
  grubenv_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | grubenv
    path: /boot/grub2/grubenv
    exists: true
    owner: root
    group: root
    mode: "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
    {{ if .Vars.rhel9cis_set_boot_pass }}
  grub_user_cfg_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | user.cfg
    path: /boot/grub2/user.cfg
    exists: true
    owner: root
    group: root
    mode: "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
    {{ end }}
command:
  efi_boot_opts:
    title: 1.4.2 | Ensure access to bootloader config is configured | /boot/efi mount options
    exec: |
      l_opts="$(awk '$1 !~ /^#/ && $2 == "/boot/efi" {print $4}' /etc/fstab)"
      if [ -z "$l_opts" ]; then
        echo "efi_not_in_fstab"
      else
        for l_opt in fmask=0077 uid=0 gid=0; do
          echo ",$l_opts," | grep -q ",$l_opt," || echo "efi_missing: $l_opt"
        done
        echo "efi_options_checked"
      fi
    exit-status: 0
    stdout:
    - '/^(efi_not_in_fstab|efi_options_checked)$/'
    - '!/^efi_missing: /'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
  {{ end }}
{{ end }}
