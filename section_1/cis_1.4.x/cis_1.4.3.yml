---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_4_3 }}
command:
  rescue_service_sulogin:
    title: 1.4.3 | Ensure authentication is required when booting into rescue mode
    exec: systemctl show -p ExecStart --value rescue.service
    exit-status: 0
    stdout:
    - '/sulogin/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.4.3
      NIST800-53R5: AC-3
  {{ end }}
{{ end }}
