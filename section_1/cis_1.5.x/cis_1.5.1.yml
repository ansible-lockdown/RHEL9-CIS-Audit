---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_5_1 }}
kernel-param:
  fs.protected_hardlinks:
    title: 1.5.1 | Ensure fs.protected_hardlinks is configured | running
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.1
      NIST800-53R5: CM-6
command:
  fs_protected_hardlinks_persistent:
    title: 1.5.1 | Ensure fs.protected_hardlinks is configured | effective persistent setting
    exec: "/usr/lib/systemd/systemd-sysctl --cat-config | grep -Eo '^[[:space:]]*fs[.]protected_hardlinks[[:space:]]*=[[:space:]]*[^[:space:]]+' | tail -n 1"
    exit-status: 0
    stdout:
    - '/^\s*fs\.protected_hardlinks\s*=\s*1$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.1
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
