---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_1_5_2 }}
kernel-param:
  fs.protected_symlinks:
    title: 1.5.2 | Ensure fs.protected_symlinks is configured | running
    value: '1'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.5.2
      NIST800-53R5:
      - AC-3(4)
      - AC-6(10)
      CCI:
      - CCI-002165
      - CCI-002235
command:
  fs_protected_symlinks_persistent:
    title: 1.5.2 | Ensure fs.protected_symlinks is configured | effective persistent setting
    exec: "/usr/lib/systemd/systemd-sysctl --cat-config | grep -Eo '^[[:space:]]*fs[.]protected_symlinks[[:space:]]*=[[:space:]]*[^[:space:]]+' | tail -n 1"
    exit-status: 0
    stdout:
    - '/^\s*fs\.protected_symlinks\s*=\s*1$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.5.2
      NIST800-53R5:
      - AC-3(4)
      - AC-6(10)
      CCI:
      - CCI-002165
      - CCI-002235
  {{ end }}
{{ end }}
