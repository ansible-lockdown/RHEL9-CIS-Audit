---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_5_2 }}
kernel-param:
  ptrace_restricted:
    title: 1.5.2 | Ensure ptrace_scope is restricted | running
    value: '1'
    name: kernel.yama.ptrace_scope
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
command:
  ptrace_restricted_2:
    title: 1.5.2 | Ensure ptrace_scope is restricted | conf
    exit-status: 0
    exec: 'grep "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^*.conf:kernel.yama.ptrace_scope\s*=\s*1/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.2
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
