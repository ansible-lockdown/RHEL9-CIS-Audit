---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_5_4 }}
command:
  storage_coredump_conf:
    title: 1.5.4 | Ensure core dump storage is disabled
    exec: "systemd-analyze cat-config systemd/coredump.conf | grep -E '^[[:space:]]*Storage[[:space:]]*=' | tail -n 1"
    exit-status: 0
    stdout:
    - '/^\s*Storage\s*=\s*none\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.4
  {{ end }}
{{ end }}
