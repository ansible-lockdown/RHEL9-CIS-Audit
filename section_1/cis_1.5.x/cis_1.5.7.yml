---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_5_7 }}
kernel-param:
  kernel.yama.ptrace_scope:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | running
    value:
      match-regexp: '^(1|2|3)$'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.7
      NIST800-53R5: CM-6
command:
  kernel_yama_ptrace_scope_persistent:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | effective persistent setting
    exec: "/usr/lib/systemd/systemd-sysctl --cat-config | grep -Eo '^[[:space:]]*kernel[.]yama[.]ptrace_scope[[:space:]]*=[[:space:]]*[^[:space:]]+' | tail -n 1"
    exit-status: 0
    stdout:
    - '/^\s*kernel\.yama\.ptrace_scope\s*=\s*(1|2|3)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.7
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
