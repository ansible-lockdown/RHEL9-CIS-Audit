---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_2 }}
command:
  crypto_policies_not_in_sshd:
    title: 1.6.2 | Ensure system wide crypto policy is not set in sshd configuration
    exec: grep -Pi '^\s*CRYPTO_POLICY\s*=' /etc/sysconfig/sshd
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.2
      NIST800-53R5:
      - SC-8
      - IA-5
      - AC-17
  {{ end }}
{{ end }}
