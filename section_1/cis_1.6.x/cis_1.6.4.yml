---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_4 }}
command:
  crypto_policies_no_ssh_cbc:
    title: 1.6.4 | Ensure system wide crypto policy disables cbc for ssh
    exec: |
      f=/etc/crypto-policies/state/CURRENT.pol
      if grep -Piq -- '^\h*cipher@(lib|open)ssh(-server|-client)?\h*=\h*([^#\n\r]+)?-CBC\b' "$f"; then echo ssh_cbc=enabled
      elif grep -Piq -- '^\h*cipher\h*=\h*([^#\n\r]+)?-CBC\b' "$f" && ! grep -Piq -- '^\h*cipher@(lib|open)ssh' "$f"; then echo ssh_cbc=enabled
      else echo ssh_cbc=disabled; fi
    exit-status: 0
    stdout:
    - '/^ssh_cbc=disabled$/'
    skip: {{ not .Vars.rhel9cis_crypto_policy_ansiblemanaged }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.4
      CISv8:
      - 3.10
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
