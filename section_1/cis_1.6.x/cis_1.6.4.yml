---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_4 }}
file:
  crypto_policies_no_weakmacs:
    title: 1.6.4 | Ensure system wide crypto policy disables macs less than 128 bits
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '!/^mac\s*=\s*.*64/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.4
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
