---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_5 }}
file:
  crypto_policies_no_ssh_chacha20:
    title: 1.6.5 | Ensure system wide crypto policy disables chacha20- poly1305 for ssh
    skip: {{ not .Vars.rhel9cis_crypto_policy_ansiblemanaged }}
    skip-reason: the crypto policy is not managed, rhel9cis_crypto_policy_ansiblemanaged is false
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '/(?i)^\s*cipher@openssh-server\s*=/'
    - '!/(?i)^\s*cipher@(lib|open)ssh(-server|-client)?\s*=.*\bchacha20-poly1305\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.5
      CISv8:
      - 3.10
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-6
  {{ end }}
{{ end }}
