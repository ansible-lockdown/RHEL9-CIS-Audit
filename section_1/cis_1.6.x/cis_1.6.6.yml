---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_6 }}
command:
  crypto_policies_no_ssh_etm:
    title: 1.6.6 | Ensure system wide crypto policy disables EtM for ssh
    exec: |
      f=/etc/crypto-policies/state/CURRENT.pol
      if grep -Piq -- '^\h*etm\h*=\h*DISABLE_ETM\b' "$f" || { grep -Piq -- '^\h*etm@libssh\h*=\h*DISABLE_ETM\b' "$f" && grep -Piq -- '^\h*etm@openssh-client\h*=\h*DISABLE_ETM\b' "$f" && grep -Piq -- '^\h*etm@openssh-server\h*=\h*DISABLE_ETM\b' "$f"; }; then echo ssh_etm=disabled; else echo ssh_etm=enabled; fi
    exit-status: 0
    stdout:
    - '/^ssh_etm=disabled$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      CISv8:
      - 3.10
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-6
  {{ end }}
{{ end }}
