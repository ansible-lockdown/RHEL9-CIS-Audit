---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_6 }}
file:
  crypto_policies_no_ssh_chacha20:
    title: 1.6.6 | Ensure system wide crypto policy disables chacha20- poly1305 for ssh
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '/(?i)^\s*cipher@openssh-server\s*=/'
    - '!/(?i)^\s*cipher@(lib|open)ssh(-server|-client)?\s*=.*\bchacha20-poly1305\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
