---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_6_7 }}
file:
  crypto_policies_no_ssh_etm:
    title: 1.6.7 | Ensure system wide crypto policy disables EtM for ssh
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '/(?i)^\s*etm@libssh\s*=\s*DISABLE_ETM\b/'
    - '/(?i)^\s*etm@openssh-client\s*=\s*DISABLE_ETM\b/'
    - '/(?i)^\s*etm@openssh-server\s*=\s*DISABLE_ETM\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.7
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
