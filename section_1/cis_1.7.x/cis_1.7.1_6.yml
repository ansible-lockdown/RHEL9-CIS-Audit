---

{{ if .Vars.rhel9cis_level_1 }}
file:
  {{ if or .Vars.rhel9cis_rule_1_7_1 .Vars.rhel9cis_rule_1_7_4 }}
  motd_config:
    title: |
      1.7.1 | Ensure message of the day is configured properly
      1.7.4 | Ensure access to /etc/motd is configured
    path: /etc/motd
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
    - '!/[Cc]ent[Oo][Ss].*/'
    - '!/[Rr]hel.*/'
    - '!/[Rr]ed[Hh]at.*/'
    - '!/[Rr]ocky.*/'
    - '!/[Aa]lma.*/'
    - '!/x86_64/'
    - '!/[Ll]inux'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.1
      - 1.7.4
      CISv8:
      - 3.3
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
      - AC-3
      - MP-2
  {{ end }}
  {{ if or .Vars.rhel9cis_rule_1_7_2 .Vars.rhel9cis_rule_1_7_5 }}
  etc_issue_config:
    title: |
      1.7.2 | Ensure local login warning banner is configured properly
      1.7.5 | Ensure access to /etc/issue is configured
    path: /etc/issue
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
    - '!/[Cc]ent[Oo][Ss].*/'
    - '!/[Rr]hel.*/'
    - '!/[Rr]ed[Hh]at.*/'
    - '!/[Rr]ocky.*/'
    - '!/[Aa]lma.*/'
    - '!/x86_64/'
    - '!/[Ll]inux'
    - '{{ .Vars.rhel9cis_warning_banner }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      - 1.7.5
      CISv8:
      - 3.3
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
      - AC-3
      - MP-2
  {{ end }}
  {{ if or .Vars.rhel9cis_rule_1_7_3 .Vars.rhel9cis_rule_1_7_6 }}
  etc_issue_net_config:
    title: |
      1.7.3 | Ensure remote login warning banner is configured properly
      1.7.6 | Ensure access to /etc/issue.net is configured
    path: /etc/issue.net
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
    - '!/[Cc]ent[Oo][Ss].*/'
    - '!/[Rr]hel.*/'
    - '!/[Rr]ed[Hh]at.*/'
    - '!/[Rr]ocky.*/'
    - '!/[Aa]lma.*/'
    - '!/x86_64/'
    - '!/[Ll]inux'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
      - 1.7.6
      CISv8:
      - 3.3
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
