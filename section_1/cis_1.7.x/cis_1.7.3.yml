---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_7_3 }}
file:
  etc_issue_net_config:
    title: 1.7.3 | Ensure remote login warning banner is configured properly
    path: /etc/issue.net
    exists: true
    contents:
    - '!/[Cc]ent[Oo][Ss].*/'
    - '!/[Rr]hel.*/'
    - '!/[Rr]ed[Hh]at.*/'
    - '!/[Rr]ocky.*/'
    - '!/[Aa]lma.*/'
    - '!/x86_64/'
    - '!/[Ll]inux/'
    - '!/(?i)\\[mrsv]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.3
      CISv8:
      - 3.3
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
{{ end }}
