---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_7_4 }}
file:
  motd_access:
    title: 1.7.4 | Ensure access to /etc/motd is configured
    path: /etc/motd
    exists: true
    mode: "0644"
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
