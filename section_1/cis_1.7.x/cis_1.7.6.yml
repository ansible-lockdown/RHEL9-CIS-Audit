---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_1_7_6 }}
command:
  etc_issue_net_access:
    title: 1.7.6 | Ensure access to /etc/issue.net is configured
    exec: if [ -e /etc/issue.net ]; then stat -Lc '%a %U %G' /etc/issue.net; else echo issue_net_absent; fi
    exit-status: 0
    stdout:
    - '/^([0246][04][04] root root|issue_net_absent)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.6
      CISv8:
      - 3.3
      - 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
