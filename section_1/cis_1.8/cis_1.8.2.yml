---

{{ if .Vars.rhel9cis_gui }}
  {{ if .Vars.rhel9cis_level_1 }}
    {{ if .Vars.rhel9cis_rule_1_8_2 }}
command:
  gdm_disable_user_list_settings:
    title: 1.8.2 | Ensure GDM disable-user-list is configured
    exec: 'echo "user_list_writable=$(gsettings writable org.gnome.login-screen disable-user-list)"; echo "user_list_disabled=$(gsettings get org.gnome.login-screen disable-user-list)"'
    exit-status: 0
    stdout:
    - '/^user_list_writable=false$/'
    - '/^user_list_disabled=true$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.2
      NIST800-53R5: CM-6
    {{ end }}
  {{ end }}
{{ end }}
