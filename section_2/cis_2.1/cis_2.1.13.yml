    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_rsync_mask }}
service:
  cis_2_1_13_rsyncd_socket_masked:
