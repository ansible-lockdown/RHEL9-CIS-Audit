---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_14 }}
    {{ if not .Vars.rhel9cis_snmp_mask }}
package:
  cis_2_1_14_net_snmp_pkg:
    title: 2.1.14 | Ensure snmp services are not in use | net-snmp not installed
    skip: {{ .Vars.rhel9cis_snmp_server }}
    skip-reason: an SNMP server is required, rhel9cis_snmp_server is true
    name: net-snmp
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.14
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_snmp_mask }}
service:
  cis_2_1_14_snmpd_service_masked:
    title: 2.1.14 | Ensure snmp services are not in use | snmpd.service masked
    skip: {{ .Vars.rhel9cis_snmp_server }}
    skip-reason: an SNMP server is required, rhel9cis_snmp_server is true
    name: snmpd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.14
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
