---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_15 }}
    {{ if not .Vars.rhel9cis_telnet_mask }}
package:
  cis_2_1_15_telnet_server_pkg:
    title: 2.1.15 | Ensure telnet server services are not in use | telnet-server not installed
    skip: {{ .Vars.rhel9cis_telnet_server }}
    skip-reason: a telnet server is required, rhel9cis_telnet_server is true
    name: telnet-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.15
      NIST800-53R5:
      - CM-11
      - CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_telnet_mask }}
service:
  cis_2_1_15_telnet_socket_masked:
    title: 2.1.15 | Ensure telnet server services are not in use | telnet.socket masked
    skip: {{ .Vars.rhel9cis_telnet_server }}
    skip-reason: a telnet server is required, rhel9cis_telnet_server is true
    name: telnet.socket
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.15
      NIST800-53R5:
      - CM-11
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
