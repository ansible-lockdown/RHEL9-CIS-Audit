    name: tftp.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
