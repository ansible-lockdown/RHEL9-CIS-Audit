---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_17 }}
    {{ if not .Vars.rhel9cis_squid_mask }}
package:
  cis_2_1_17_squid_pkg:
    title: 2.1.17 | Ensure web proxy server services are not in use | squid not installed
    skip: {{ .Vars.rhel9cis_squid_server }}
    skip-reason: a web proxy server is required, rhel9cis_squid_server is true
    name: squid
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.17
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_squid_mask }}
service:
  cis_2_1_17_squid_service_masked:
    title: 2.1.17 | Ensure web proxy server services are not in use | squid.service masked
    skip: {{ .Vars.rhel9cis_squid_server }}
    skip-reason: a web proxy server is required, rhel9cis_squid_server is true
    name: squid.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.17
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
