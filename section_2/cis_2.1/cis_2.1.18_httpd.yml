---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_18 }}
    {{ if not .Vars.rhel9cis_httpd_mask }}
package:
  cis_2_1_18_httpd_pkg:
    title: 2.1.18 | Ensure web server services are not in use | httpd not installed
    skip: {{ .Vars.rhel9cis_httpd_server }}
    skip-reason: an httpd web server is required, rhel9cis_httpd_server is true
    name: httpd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_httpd_mask }}
service:
  cis_2_1_18_httpd_socket_masked:
    title: 2.1.18 | Ensure web server services are not in use | httpd.socket masked
    skip: {{ .Vars.rhel9cis_httpd_server }}
    skip-reason: an httpd web server is required, rhel9cis_httpd_server is true
    name: httpd.socket
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5: CM-7
  cis_2_1_18_httpd_service_masked:
    title: 2.1.18 | Ensure web server services are not in use | httpd.service masked
    skip: {{ .Vars.rhel9cis_httpd_server }}
    skip-reason: an httpd web server is required, rhel9cis_httpd_server is true
    name: httpd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
