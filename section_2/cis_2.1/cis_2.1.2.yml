---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_2 }}
    {{ if not .Vars.rhel9cis_avahi_mask }}
package:
  cis_2_1_2_avahi_pkg:
    title: 2.1.2 | Ensure avahi daemon services are not in use | avahi not installed
    skip: {{ .Vars.rhel9cis_avahi_server }}
    skip-reason: the avahi daemon is required, rhel9cis_avahi_server is true
    name: avahi
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5: SI-4
    {{ end }}
    {{ if .Vars.rhel9cis_avahi_mask }}
service:
  cis_2_1_2_avahi_daemon_socket_masked:
    title: 2.1.2 | Ensure avahi daemon services are not in use | avahi-daemon.socket masked
    skip: {{ .Vars.rhel9cis_avahi_server }}
    skip-reason: the avahi daemon is required, rhel9cis_avahi_server is true
    name: avahi-daemon.socket
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5: SI-4
  cis_2_1_2_avahi_daemon_service_masked:
    title: 2.1.2 | Ensure avahi daemon services are not in use | avahi-daemon.service masked
    skip: {{ .Vars.rhel9cis_avahi_server }}
    skip-reason: the avahi daemon is required, rhel9cis_avahi_server is true
    name: avahi-daemon.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5: SI-4
    {{ end }}
  {{ end }}
{{ end }}
