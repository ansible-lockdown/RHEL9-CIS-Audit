---

{{ if not .Vars.rhel9cis_gui }}
  {{ if .Vars.rhel9cis_level_2 }}
    {{ if .Vars.rhel9cis_rule_2_1_20 }}
package:
  gdm_removed:
    title: 2.1.20 | Ensure a graphical user interface is not in use | gdm removed
    installed: false
    name: gdm
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 2.1.20
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
command:
  gui_default_target:
    title: 2.1.20 | Ensure a graphical user interface is not in use | default target not graphical
    exec: systemctl get-default
    exit-status: 0
    stdout:
    - '/\.target$/'
    - '!/^graphical\.target$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 2.1.20
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
