---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if not .Vars.rhel9cis_is_mail_server }}
    {{ if .Vars.rhel9cis_rule_2_1_21 }}
command:
  mta_listening_ports:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode | not listening on non-loopback
    exec: ss -plntu | grep -P -- ':(25|465|587)\b' | grep -Pv -- '\h+(127\.0\.0\.1|\[?::1\]?):(25|465|587)\b'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
    {{ if .Vars.rhel9cis_mta_postfix_installed }}
file:
  /etc/postfix/main.cf:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode | postfix inet_interfaces
    exists: true
    contents:
    - '/^\s*inet_interfaces\s*=\s*(loopback-only|localhost)\s*$/'
    - '!/^\s*inet_interfaces\s*=\s*(all|ipv4|ipv6)\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
