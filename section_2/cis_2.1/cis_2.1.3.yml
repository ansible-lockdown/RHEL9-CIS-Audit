---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_2_1_3 }}
    {{ if not .Vars.rhel9cis_cockpit_server }}
      {{ if not .Vars.rhel9cis_cockpit_mask }}
package:
  cockpit_ws_pkg:
    title: 2.1.3 | Ensure cockpit web services are not in use | pkg removed
    name: cockpit-ws
    installed: false
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
      {{ end }}
      {{ if .Vars.rhel9cis_cockpit_mask }}
file:
  cockpit_socket_masked:
    title: 2.1.3 | Ensure cockpit web services are not in use | socket masked
    path: /etc/systemd/system/cockpit.socket
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
  cockpit_service_masked:
    title: 2.1.3 | Ensure cockpit web services are not in use | service masked
    path: /etc/systemd/system/cockpit.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
