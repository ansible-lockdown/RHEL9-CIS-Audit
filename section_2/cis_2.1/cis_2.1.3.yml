---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_2_1_3 }}
    {{ if not .Vars.rhel9cis_cockpit_mask }}
package:
  cis_2_1_3_cockpit_ws_pkg:
    title: 2.1.3 | Ensure cockpit web services are not in use | cockpit-ws not installed
    skip: {{ .Vars.rhel9cis_cockpit_server }}
    skip-reason: cockpit is required, rhel9cis_cockpit_server is true
    name: cockpit-ws
    installed: false
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_cockpit_mask }}
service:
  cis_2_1_3_cockpit_socket_masked:
    title: 2.1.3 | Ensure cockpit web services are not in use | cockpit.socket masked
    skip: {{ .Vars.rhel9cis_cockpit_server }}
    skip-reason: cockpit is required, rhel9cis_cockpit_server is true
    name: cockpit.socket
    masked: true
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
  cis_2_1_3_cockpit_service_masked:
    title: 2.1.3 | Ensure cockpit web services are not in use | cockpit.service masked
    skip: {{ .Vars.rhel9cis_cockpit_server }}
    skip-reason: cockpit is required, rhel9cis_cockpit_server is true
    name: cockpit.service
    masked: true
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 2.1.3
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
