---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_4 }}
    {{ if not .Vars.rhel9cis_dhcp_mask }}
package:
  cis_2_1_4_dhcp_server_pkg:
    title: 2.1.4 | Ensure dhcp server services are not in use | dhcp-server not installed
    skip: {{ .Vars.rhel9cis_dhcp_server }}
    skip-reason: a DHCP server is required, rhel9cis_dhcp_server is true
    name: dhcp-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.4
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_dhcp_mask }}
service:
  cis_2_1_4_dhcpd_service_masked:
    title: 2.1.4 | Ensure dhcp server services are not in use | dhcpd.service masked
    skip: {{ .Vars.rhel9cis_dhcp_server }}
    skip-reason: a DHCP server is required, rhel9cis_dhcp_server is true
    name: dhcpd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.4
      NIST800-53R5: CM-7
  cis_2_1_4_dhcpd6_service_masked:
    title: 2.1.4 | Ensure dhcp server services are not in use | dhcpd6.service masked
    skip: {{ .Vars.rhel9cis_dhcp_server }}
    skip-reason: a DHCP server is required, rhel9cis_dhcp_server is true
    name: dhcpd6.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.4
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
