---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_5 }}
    {{ if not .Vars.rhel9cis_dns_mask }}
package:
  cis_2_1_5_bind_pkg:
    title: 2.1.5 | Ensure dns server services are not in use | bind not installed
    skip: {{ .Vars.rhel9cis_dns_server }}
    skip-reason: a DNS server is required, rhel9cis_dns_server is true
    name: bind
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_dns_mask }}
service:
  cis_2_1_5_named_service_masked:
    title: 2.1.5 | Ensure dns server services are not in use | named.service masked
    skip: {{ .Vars.rhel9cis_dns_server }}
    skip-reason: a DNS server is required, rhel9cis_dns_server is true
    name: named.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.5
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
