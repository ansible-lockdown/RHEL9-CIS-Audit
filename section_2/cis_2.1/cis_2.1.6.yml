---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_6 }}
    {{ if not .Vars.rhel9cis_dnsmasq_mask }}
package:
  cis_2_1_6_dnsmasq_pkg:
    title: 2.1.6 | Ensure dnsmasq services are not in use | dnsmasq not installed
    skip: {{ .Vars.rhel9cis_dnsmasq_server }}
    skip-reason: dnsmasq is required, rhel9cis_dnsmasq_server is true
    name: dnsmasq
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_dnsmasq_mask }}
service:
  cis_2_1_6_dnsmasq_service_masked:
    title: 2.1.6 | Ensure dnsmasq services are not in use | dnsmasq.service masked
    skip: {{ .Vars.rhel9cis_dnsmasq_server }}
    skip-reason: dnsmasq is required, rhel9cis_dnsmasq_server is true
    name: dnsmasq.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
