---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_1_7 }}
    {{ if not .Vars.rhel9cis_samba_mask }}
package:
  cis_2_1_7_samba_pkg:
    title: 2.1.7 | Ensure samba file server services are not in use | samba not installed
    skip: {{ .Vars.rhel9cis_samba_server }}
    skip-reason: a samba server is required, rhel9cis_samba_server is true
    name: samba
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.rhel9cis_samba_mask }}
service:
  cis_2_1_7_smb_service_masked:
    title: 2.1.7 | Ensure samba file server services are not in use | smb.service masked
    skip: {{ .Vars.rhel9cis_samba_server }}
    skip-reason: a samba server is required, rhel9cis_samba_server is true
    name: smb.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.7
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
