---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_2_4_1_4 }}
file:
  cis_2_4_1_4_cron_daily:
    title: 2.4.1.4 | Ensure access to /etc/cron.daily is configured
    skip: {{ not .Discovered.cronie_installed }}
    skip-reason: cron is not installed, cronie package absent
    path: /etc/cron.daily
    exists: true
    filetype: directory
    owner: root
    group: root
    mode:
      match-regexp: '^0[0-7]00$'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
