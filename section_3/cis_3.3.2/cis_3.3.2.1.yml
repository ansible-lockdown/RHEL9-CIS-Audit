---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if not .Vars.rhel9cis_is_router }}
    {{ if .Vars.rhel9cis_ipv6_required }}
      {{ if .Vars.rhel9cis_rule_3_3_2_1 }}
kernel-param:
  net.ipv6.conf.all.forwarding:
    title: 3.3.2.1 | Ensure net.ipv6.conf.all.forwarding is configured | running config
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.1
      NIST800-53R5: CM-6
command:
  cis_3_3_2_1_sysctl_conf:
    title: 3.3.2.1 | Ensure net.ipv6.conf.all.forwarding is configured | effective systemd-sysctl config
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv6(\.|/)conf(\.|/)all(\.|/)forwarding\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv6.conf.all.forwarding=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv6\.conf\.all\.forwarding=0$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.1
      NIST800-53R5: CM-6
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
