---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_ipv6_required }}
    {{ if .Vars.rhel9cis_rule_3_3_2_7 }}
kernel-param:
  net.ipv6.conf.all.accept_ra:
    title: 3.3.2.7 | Ensure net.ipv6.conf.all.accept_ra is configured | running config
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.7
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
command:
  cis_3_3_2_7_sysctl_conf:
    title: 3.3.2.7 | Ensure net.ipv6.conf.all.accept_ra is configured | effective systemd-sysctl config
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv6(\.|/)conf(\.|/)all(\.|/)accept_ra\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv6.conf.all.accept_ra=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv6\.conf\.all\.accept_ra=0$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.7
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
    {{ end }}
  {{ end }}
{{ end }}
