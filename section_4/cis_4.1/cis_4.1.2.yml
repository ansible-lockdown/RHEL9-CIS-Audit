---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_4_1_2 }}
file:
  /etc/firewalld/firewalld.conf:
    title: 4.1.2 | Ensure firewalld backend is configured
    exists: true
    contents:
    - '!/^\s*FirewallBackend\s*=\s*iptables\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - CA-9
  {{ end }}
{{ end }}
