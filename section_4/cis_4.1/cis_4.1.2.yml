---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_4_1_2 }}
    {{ if eq .Vars.rhel9cis_firewall "nftables" }}
file:
  firewalld_masked:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | firewalld masked
    path: /etc/systemd/system/firewalld.service
    filetype: symlink
    linked-to: /dev/null
    exists: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
service:
  firewalld:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | firewalld service stopped
    enabled: false
    running: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
  nftables:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | nftables running
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
  {{ end }}
  {{ if eq .Vars.rhel9cis_firewall "firewalld" }}
file:
  nftables_masked:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | nftables masked
    path: /etc/systemd/system/nftables.service
    filetype: symlink
    linked-to: /dev/null
    exists: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
service:
  firewalld:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | firewalld running and enabled
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
  nftables:
    title: 4.1.2 | Ensure a single firewall configuration utility is in use | nftables stopped
    enabled: false
    running: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.2
      NIST800-53R5:
      - NA
    {{ end }}
  {{ end }}
{{ end }}
