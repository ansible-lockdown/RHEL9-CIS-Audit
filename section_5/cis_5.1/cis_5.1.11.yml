---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_5_1_11 }}
command:
  ssh_disable_forward_live:
    title: 5.1.11 | Ensure sshd DisableForwarding is enabled
    exec: sshd -T 2>/dev/null | grep -i -- '^disableforwarding\s'
    exit-status: 0
    stdout:
    - '/^disableforwarding yes$/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.11
      CISv8: 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
