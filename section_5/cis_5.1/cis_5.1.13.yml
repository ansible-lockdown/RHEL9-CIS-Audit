---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_13 }}
command:
  ssh_hostbased_auth_live:
    title: 5.1.13 | Ensure sshd HostbasedAuthentication is disabled
    exec: sshd -T 2>/dev/null | grep -i -- '^hostbasedauthentication\s'
    exit-status: 0
    stdout:
    - '/^hostbasedauthentication no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.13
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
