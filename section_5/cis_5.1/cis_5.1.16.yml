---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_16 }}
file:
  sshd_authtries:
    title: 5.1.16 | Ensure sshd MaxAuthTries is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - "/^MaxAuthTries [1-4]/"
    - "!/^MaxAuthTries [5-9]/"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
command:
  sshd_authtries_live:
    title: 5.1.16 | Ensure sshd MaxAuthTries is configured | live
    exec: sshd -T | grep -i '^maxauthtries'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - "/(?i)^maxauthtries [1-4]/"
    - "!/(?i)^maxauthtries [5-9]/"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
