---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_16 }}
command:
  ssh_loglevel_live:
    title: 5.1.16 | Ensure sshd LogLevel is configured
    exec: sshd -T 2>/dev/null | grep -i -- '^loglevel\s'
    exit-status: 0
    stdout:
    - '/(?i)^loglevel (VERBOSE|INFO)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-12
      - AU-3
      - SI-5
  {{ end }}
{{ end }}
