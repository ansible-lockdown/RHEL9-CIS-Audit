---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_19 }}
command:
  ssh_maxsessions_live:
    title: 5.1.19 | Ensure sshd MaxSessions is configured
    exec: sshd -T 2>/dev/null | grep -i -- '^maxsessions\s'
    exit-status: 0
    stdout:
    - '/^maxsessions ([1-9]|10)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.19
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  ssh_maxsessions_config:
    title: 5.1.19 | Ensure sshd MaxSessions is configured | config files
    exec: grep -Psi -- '^\h*MaxSessions\h+\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    exit-status:
      or:
      - 1
      - 2
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.19
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
