---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_22 }}
command:
  ssh_userenv_live:
    title: 5.1.22 | Ensure sshd PermitUserEnvironment is disabled
    exec: sshd -T 2>/dev/null | grep -i -- '^permituserenvironment\s'
    exit-status: 0
    stdout:
    - '/(?i)^permituserenvironment no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.22
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
