---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_6 }}
command:
  no_weak_ssh_kex:
    title: 5.1.6 | Ensure sshd KexAlgorithms is configured
    exec: |
      l_offered="$(sshd -T 2>/dev/null | awk '$1=="kexalgorithms"{print $2}')"
      [ -n "$l_offered" ] && echo "kexalgorithms_offered"
      printf '%s\n' "$l_offered" | tr ',' '\n' | grep -Fx -e diffie-hellman-group1-sha1 -e diffie-hellman-group14-sha1 -e diffie-hellman-group-exchange-sha1 | sed 's/^/WEAK: /'
      true
    exit-status: 0
    stdout:
    - '/^kexalgorithms_offered$/'
    - '!/^WEAK:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.6
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
