---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_7 }}
command:
  no_weak_ssh_macs:
    title: 5.1.7 | Ensure sshd MACs are configured
    exec: |
      l_offered="$(sshd -T 2>/dev/null | awk '$1=="macs"{print $2}')"
      [ -n "$l_offered" ] && echo "macs_offered"
      printf '%s\n' "$l_offered" | tr ',' '\n' | grep -Fx -e hmac-md5 -e hmac-md5-96 -e hmac-ripemd160 -e hmac-sha1-96 -e umac-64@openssh.com -e hmac-md5-etm@openssh.com -e hmac-md5-96-etm@openssh.com -e hmac-ripemd160-etm@openssh.com -e hmac-sha1-96-etm@openssh.com -e umac-64-etm@openssh.com | sed 's/^/WEAK: /'
      true
    exit-status: 0
    stdout:
    - '/^macs_offered$/'
    - '!/^WEAK:/'
    skip: {{ not .Vars.rhel9cis_crypto_policy_ansiblemanaged }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.7
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
