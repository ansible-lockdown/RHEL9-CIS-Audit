---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_8 }}
file:
  sshd_banner:
    title: 5.1.8 | Ensure sshd Banner is configured | sshd_default
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^Banner /etc/issue.net/'
    - '!/^Banner none/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
command:
  ssh_configd_banner:
    title: 5.1.8 | Ensure sshd Banner is configured | conf.d banner settings
    exec: grep -Eis '^\s*Banner\s+"?none\b' /etc/ssh/sshd_config.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
