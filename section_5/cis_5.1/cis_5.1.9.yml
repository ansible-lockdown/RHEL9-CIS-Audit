---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_1_9 }}
command:
  sshd_banner_live:
    title: 5.1.9 | Ensure sshd Banner is configured
    exec: sshd -T 2>/dev/null | grep -Pi -- '^banner\h+\/\H+'
    exit-status: 0
    stdout:
    - '/^banner \/\S+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  sshd_banner_content:
    title: 5.1.9 | Ensure sshd Banner is configured | banner content
    exec: |
      l_banner="$(sshd -T 2>/dev/null | awk '$1 == "banner" {print $2}')"
      l_os_id="$(awk -F= '$1=="ID"{gsub(/"/,"",$2); print $2}' /etc/os-release)"
      [ -n "$l_os_id" ] || l_os_id="rhel"
      grep -Psi -- '(\\v|\\r|\\m|\\s|\b'"$l_os_id"'\b)' "$l_banner"
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
