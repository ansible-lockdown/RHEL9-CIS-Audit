---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_2_11 }}
command:
  sudo_timestamp_type:
    title: 5.2.11 | Ensure sudo timestamp_type is configured
    exec: grep -rPi -- 'timestamp_type\h*=\h*global' /etc/sudoers /etc/sudoers.d/
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 0
      CIS_ID:
      - 5.2.11
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
