---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_2_12 }}
file:
  restrict_su:
    title: 5.2.12 | Ensure access to the su command is restricted
    path: /etc/pam.d/su
    exists: true
    contents:
    - '/^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group={{ .Vars.rhel9cis_sugroup }}|group={{ .Vars.rhel9cis_sugroup }}\s+(\S+\s+)*use_uid)\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.12
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
command:
  sugroup_etc_group:
    title: 5.2.12 | Ensure access to the su command is restricted | group is empty
    exec: grep -E '^{{ .Vars.rhel9cis_sugroup }}:' /etc/group
    exit-status: 0
    stdout:
    - '/^{{ .Vars.rhel9cis_sugroup }}:x:\d+:$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.12
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
