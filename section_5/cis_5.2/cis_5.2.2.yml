---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_2_2 }}
command:
  sudoers_files_access:
    title: 5.2.2 | Ensure access on sudoers configuration files is configured
    exec: |
      find /etc/sudoers /etc/sudoers.d/ -type f \( -perm /0337 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
      echo "scan_rc=$?"
    exit-status: 0
    stdout:
    - '/^scan_rc=0$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 0
      CIS_ID:
      - 5.2.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
