---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_2_3 }}
command:
  sudoers_d_dir_access:
    title: 5.2.3 | Ensure access on the /etc/sudoers.d directory is configured
    exec: |
      find /etc/sudoers.d -maxdepth 0 -type d \( -perm /0027 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
      echo "scan_rc=$?"
    exit-status: 0
    stdout:
    - '/^scan_rc=0$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 0
      CIS_ID:
      - 5.2.3
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
