---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_5_2_4 }}
command:
  nopasswd_sudoers_d:
    title: 5.2.4 | Ensure users must provide password for escalation
    exec: |
      grep -rhs -- '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d | awk '$1 !~ /^(#{{ range .Vars.rhel9cis_sudoers_exclude_nopasswd_list }}|{{ . }}{{ end }})$/ {print "FAIL: " $0}'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.2.4
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
