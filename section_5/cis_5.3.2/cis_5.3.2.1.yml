---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_3_2_1 }}
command:
  authselect_current_profile:
    title: 5.3.2.1 | Ensure PAM is managed by an active authselect profile | active profile
    exec: authselect current
    exit-status: 0
    stdout:
    - '/^Profile ID: \S+/'
    skip: {{ or (not .Vars.rhel9cis_disruption_high) (not .Vars.rhel9cis_allow_authselect_updates) }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1
      CISv8: 16.2
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  authselect_check_5_3_2_1:
    title: 5.3.2.1 | Ensure PAM is managed by an active authselect profile | authselect check
    exec: authselect check
    exit-status: 0
    stdout:
    - '/Current configuration is valid/'
    skip: {{ or (not .Vars.rhel9cis_disruption_high) (not .Vars.rhel9cis_allow_authselect_updates) }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1
      CISv8: 16.2
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  {{ end }}
{{ end }}
