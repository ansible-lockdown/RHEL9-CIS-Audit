---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_3_2_4 }}
file:
  pam_pwhistory_enabled_system_auth:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^\s*password\s+(requisite|required)\s+pam_pwhistory\.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  pam_pwhistory_enabled_password_auth:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^\s*password\s+(requisite|required)\s+pam_pwhistory\.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
command:
  authselect_check_5_3_2_4:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled | authselect check
    exec: authselect check
    exit-status: 0
    stdout:
    - '/Current configuration is valid/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
