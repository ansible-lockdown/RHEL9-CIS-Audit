---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_3_3_1_1 }}
file:
  faillock_attempts_deny:
    title: 5.3.3.1.1 | Ensure password failed attempts lockout is configured
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^\s*deny\s*=\s*[1-5]\b/'
    - '!/^\s*deny\s*=\s*(0|[6-9]|[1-9][0-9]+)\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
command:
  faillock_attempts_deny_pam:
    title: 5.3.3.1.1 | Ensure password failed attempts lockout is configured | pam files
    exec: grep -Pi -- '^\h*auth\h+(requisite|required|sufficient)\h+pam_faillock\.so\h+([^#\n\r]+\h+)?deny\h*=\h*(0|[6-9]|[1-9][0-9]+)\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: NA
  {{ end }}
{{ end }}
