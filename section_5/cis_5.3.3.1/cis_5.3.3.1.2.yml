---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_3_3_1_2 }}
file:
  faillock_unlock_time:
    title: 5.3.3.1.2 | Ensure password unlock time is configured
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^\s*unlock_time\s*=\s*(0|9[0-9][0-9]|[1-9][0-9]{3,})\b/'
    - '!/^\s*unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
command:
  faillock_unlock_time_pam:
    title: 5.3.3.1.2 | Ensure password unlock time is configured | pam files
    exec: grep -Pi -- '^\h*auth\h+(requisite|required|sufficient)\h+pam_faillock\.so\h+([^#\n\r]+\h+)?unlock_time\h*=\h*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
