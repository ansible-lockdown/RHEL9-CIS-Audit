---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_5_3_3_1_3 }}
file:
  faillock_even_root:
    title: 5.3.3.1.3 | Ensure password failed attempts lockout includes root account
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^\s*(even_deny_root|root_unlock_time\s*=\s*\d+)\b/'
    - '!/^\s*root_unlock_time\s*=\s*([1-9]|[1-5][0-9])\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.3.3.1.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
command:
  faillock_even_root_pam:
    title: 5.3.3.1.3 | Ensure password failed attempts lockout includes root account | pam files
    exec: grep -Pi -- '^\h*auth\h+([^#\n\r]+\h+)pam_faillock\.so\h+([^#\n\r]+\h+)?root_unlock_time\h*=\h*([1-9]|[1-5][0-9])\b' /etc/pam.d/system-auth /etc/pam.d/password-auth
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.3.3.1.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
