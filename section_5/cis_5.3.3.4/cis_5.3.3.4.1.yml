---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_3_3_4_1 }}
file:
  pam_unix_nullok_password-auth:
    title: 5.3.3.4.1 | Ensure pam_unix does not include nullok | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '!/.*pam_unix.so.*nullok/'
    skip: {{ not .Vars.rhel9cis_disruption_high }}
    skip-reason: rhel9cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.1
      NIST800-53R5: CM-6
  pam_unix_nullok_system-auth:
    title: 5.3.3.4.1 | Ensure pam_unix does not include nullok | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '!/.*pam_unix.so.*nullok/'
    skip: {{ not .Vars.rhel9cis_disruption_high }}
    skip-reason: rhel9cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.1
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
