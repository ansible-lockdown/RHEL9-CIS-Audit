---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_4_1_3 }}
file:
  login_defs_warn_age:
    title: 5.4.1.3 | Ensure password expiration warning days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^\s*PASS_WARN_AGE\s+([7-9]|[1-9][0-9]+)\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
command:
  check_users_warn_age:
    title: 5.4.1.3 | Ensure password expiration warning days is configured | existing users
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
