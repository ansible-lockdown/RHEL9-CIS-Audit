---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_5_4_2_7 }}
command:
  secure_system_accts:
    title: 5.4.2.7 | Ensure system accounts do not have a valid login shell
    exec: |
      l_valid_shells="^($(awk -F/ '($NF != "nologin" && $NF != "false") {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$"
      l_uid_min="$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"
      awk -v pat="$l_valid_shells" -v uidmin="${l_uid_min:-1000}" -F: '($1 !~ /^(root|halt|sync|shutdown|nfsnobody{{ range .Vars.rhel9cis_system_users_shell }}|{{ . }}{{ end }})$/ && ($3 < uidmin || $3 == 65534) && $(NF) ~ pat) {print "FAIL: " $1 " has a valid shell: " $7}' /etc/passwd
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    skip: {{ not .Vars.rhel9cis_disruption_high }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.2.7
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-2(5)
      - AC-3
      - AC-11
      - MP-2
  {{ end }}
{{ end }}
