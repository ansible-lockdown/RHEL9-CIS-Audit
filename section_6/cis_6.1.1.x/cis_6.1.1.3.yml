---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_1_1_3 }}
command:
  journald_forward_to_syslog:
    title: 6.1.1.3 | Ensure journald is configured to send logs to rsyslog
    exec: 'systemd-analyze cat-config systemd/journald.conf | grep -Pi -- ''^\h*ForwardToSyslog\h*='' | tail -n 1'
    exit-status: 0
    stdout:
    - '/(?i)^\s*ForwardToSyslog\s*=\s*yes\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.3
      CISv8:
      - 8.2
      - 8.9
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
