---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_1_2_14 }}
file:
  /etc/logrotate.conf:
    title: 6.1.2.14 | Ensure logrotate is configured
    exists: true
    contents:
    - '/^\s*(daily|weekly|monthly|yearly)\s*$/'
    - '/^\s*rotate\s+\d+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.14
      NIST800-53R5: AU-8
  {{ end }}
{{ end }}
