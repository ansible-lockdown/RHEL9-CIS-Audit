---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_1_2_3 }}
command:
  rsyslog_file_create_mode:
    title: 6.1.2.3 | Ensure rsyslog log file creation mode is configured
    exec: 'grep -Psih -- ''^\h*(\$FileCreateMode\h+|.*\bfileCreateMode\h*=\h*"?)0[0-7]{3}'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf'
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/(FileCreateMode\s+|fileCreateMode\s*=\s*"?)0[0246][04]0\b/'
    - '!/(FileCreateMode\s+|fileCreateMode\s*=\s*"?)0([1357][0-7]{2}|[0-7][1235-7][0-7]|[0-7]{2}[1-7])\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.3
      CISv8:
      - 3.3
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - AC-6
      - MP-2
  {{ end }}
{{ end }}
