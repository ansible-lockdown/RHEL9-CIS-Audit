---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_1_3_1 }}
command:
  logfile_access_configured:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured
    exec: |
      find /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) -exec stat -c '%n %U %G %a' {} + 2>/dev/null | awk '
      { f=$1; u=$2; g=$3; m=strtonum("0" $4); n=f; sub(/.*\//, "", n)
        if (n ~ /^((u|b|w)tmp|lastlog)/) { mask=75; ok=(u=="root" && (g=="root" || g=="utmp")) }
        else if (n ~ /\.journal~?$/) { mask=95; ok=(u=="root" && (g=="root" || g=="systemd-journal")) }
        else if (f ~ /^\/var\/log\/(apt\/|dnf\.|dnf5\.log|hawkey\.log|zypp\/|zypper\.log|yum\.log)/) { mask=91; ok=(u=="root" && (g=="root" || g=="adm")) }
        else if (n ~ /^(cloud-init\.log|localmessages|waagent\.log)/) { mask=91; ok=((u=="root" || u=="syslog") && (g=="root" || g=="adm")) }
        else if (u != "root" && u != "syslog") { mask=95; ok=1 }
        else { mask=95; ok=(g=="root" || g=="adm") }
        if (and(m, mask) != 0 || !ok) print "FAIL: " f " " u " " g " " $4 }'
      echo check_complete
    exit-status: 0
    stdout:
    - '/^check_complete$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
