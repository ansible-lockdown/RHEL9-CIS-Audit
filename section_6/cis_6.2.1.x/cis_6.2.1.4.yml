---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_2_1_4 }}
command:
  single_logging_system:
    title: 6.2.1.4 | Ensure only one logging system is in use
    exec: systemctl is-active rsyslog.service
    exit-status:
      or:
      - 0
      - 3
      - 4
    stdout:
    {{ if eq .Vars.rhel9cis_syslog "rsyslog" }}
    - '/^active$/'
    {{ else }}
    - '!/^active$/'
    {{ end }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.4
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  {{ end }}
{{ end }}
