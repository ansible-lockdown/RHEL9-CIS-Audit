---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_2_2_1_2 }}
file:
  journald_remote_config:
    title: 6.2.2.1.2 | Ensure systemd-journal-upload authentication is configured
    path: /etc/systemd/journal-upload.conf
    exists: true
    contents:
    - '/^URL=/'
    - '/^\s*ServerKeyFile=.*\.pem/'
    - '/^\s*ServerCertificateFile=.*\.pem/'
    - '/^\s*TrustedCertificateFile=.*\.pem/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.1.2
      NIST800-53R5:
      - AU-2
      - AU-12
  {{ end }}
{{ end }}
