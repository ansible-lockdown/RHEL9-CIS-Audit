---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_2_1 }}
command:
  max_log_auditd_conf:
    title: 6.2.2.1 | Ensure audit log storage size is configured
    exec: grep max_log_file /etc/audit/auditd.conf
    exit-status: 0
    stdout:
    - '/^\s*max_log_file\s*=\s*\d+\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.2.1
      CISv8: 8.3
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
