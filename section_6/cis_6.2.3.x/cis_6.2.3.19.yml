---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_19 }}
command:
  auditd_6_2_3_19_cnf:
    title: 6.2.3.19 | Ensure discretionary access control permission modification events chown,fchown,lchown,fchownat are collected | conf check
    exec: 'grep -Phs -- ''chown'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?chown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?fchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?lchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?fchownat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?chown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?fchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?lchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?fchownat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.19
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_6_2_3_19_live:
    title: 6.2.3.19 | Ensure discretionary access control permission modification events chown,fchown,lchown,fchownat are collected | running
    exec: 'auditctl -l | grep -P -- ''chown'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?chown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?fchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?lchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?fchownat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?chown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?fchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?lchown(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?fchownat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)perm_mod\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.19
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
