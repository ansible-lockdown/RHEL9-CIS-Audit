---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_2 }}
command:
  auditd_6_2_3_2_cnf:
    title: 6.2.3.2 | Ensure actions as another user are always logged | conf check
    exec: 'grep -Phs -- ''execve'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?execve(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?execveat(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?execve(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?execveat(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/-C (euid!=uid|uid!=euid)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.2
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  auditd_6_2_3_2_live:
    title: 6.2.3.2 | Ensure actions as another user are always logged | running
    exec: 'auditctl -l | grep -P -- ''execve'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?execve(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?execveat(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?execve(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?execveat(,\S+)? (.* )?(-k |-F key=)user_emulation\s*$/'
    - '/-C (euid!=uid|uid!=euid)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.2
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
