---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_21 }}
command:
  auditd_6_2_3_21_cnf:
    title: 6.2.3.21 | Ensure successful file system mounts are collected | conf check
    exec: 'grep -Phs -- ''mount'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?mount(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?mount(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-12
  auditd_6_2_3_21_live:
    title: 6.2.3.21 | Ensure successful file system mounts are collected | running
    exec: 'auditctl -l | grep -P -- ''mount'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?mount(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?mount(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)mounts\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.21
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-12
  {{ end }}
{{ end }}
