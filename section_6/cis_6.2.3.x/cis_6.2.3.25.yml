---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_25 }}
command:
  auditd_6_2_3_25_cnf:
    title: 6.2.3.25 | Ensure rename file deletion events by users are collected | conf check
    exec: 'grep -Phs -- ''rename'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?rename(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?renameat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?renameat2(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?rename(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?renameat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?renameat2(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.25
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-12
      - SC-7
  auditd_6_2_3_25_live:
    title: 6.2.3.25 | Ensure rename file deletion events by users are collected | running
    exec: 'auditctl -l | grep -P -- ''rename'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?rename(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?renameat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?renameat2(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?rename(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?renameat(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?renameat2(,\S+)? (.* )?-F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)delete\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.25
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-12
      - SC-7
  {{ end }}
{{ end }}
