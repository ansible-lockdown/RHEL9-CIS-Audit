---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_26 }}
command:
  auditd_6_2_3_26_cnf:
    title: 6.2.3.26 | Ensure events that modify the system's Mandatory Access Controls are collected | conf check
    exec: 'grep -Phs -- ''selinux'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    - '/^\s*(-w /usr/share/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/usr/share/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    - '/^\s*(-w /var/lib/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/lib/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.26
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_6_2_3_26_live:
    title: 6.2.3.26 | Ensure events that modify the system's Mandatory Access Controls are collected | running
    exec: 'auditctl -l | grep -P -- ''selinux'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    - '/^\s*(-w /usr/share/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/usr/share/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    - '/^\s*(-w /var/lib/selinux/? -p wa -k MAC-policy|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/lib/selinux/? -F perm=wa (-k |-F key=)MAC-policy)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.26
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
