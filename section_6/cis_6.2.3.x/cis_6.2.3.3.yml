---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_3 }}
command:
  forward_journald_conf:
    title: 6.2.3.3 | Ensure journald is configured to send logs to rsyslog
    exec: grep -rhi '^\s*ForwardToSyslog' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/(?i)^\s*ForwardToSyslog\s*=\s*yes/'
    - '!/(?i)^\s*ForwardToSyslog\s*=\s*no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.3
      CISv8:
      - 8.2
      - 8.9
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
