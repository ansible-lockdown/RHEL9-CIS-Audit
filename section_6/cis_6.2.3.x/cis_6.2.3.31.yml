---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_31 }}
command:
  auditd_6_2_3_31_cnf:
    title: 6.2.3.31 | Ensure kernel module loading unloading and modification is collected | conf check
    exec: 'grep -Phs -- ''/usr/bin/kmod'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always)( -F arch=b(32|64))?( -S all)? -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.31
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-12
  auditd_6_2_3_31_live:
    title: 6.2.3.31 | Ensure kernel module loading unloading and modification is collected | running
    exec: 'auditctl -l | grep -P -- ''/usr/bin/kmod'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always)( -F arch=b(32|64))?( -S all)? -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=(unset|-1|4294967295) (-k |-F key=)kernel_modules\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.31
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-12
  {{ end }}
{{ end }}
