---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_3_5 }}
command:
  auditd_6_2_3_5_cnf:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | conf check
    exec: 'grep -Phs -- ''sethostname'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?sethostname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?setdomainname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?sethostname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?setdomainname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_6_2_3_5_live:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | running
    exec: 'auditctl -l | grep -P -- ''sethostname'''
    exit-status: 0
    stdout:
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?sethostname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b64 .*-S (\S+,)?setdomainname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?sethostname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    - '/^\s*-a (always,exit|exit,always) -F arch=b32 .*-S (\S+,)?setdomainname(,\S+)? (.* )?(-k |-F key=)system-locale\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
