---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_4_1 }}
command:
  audit_logfile_dir_mode:
    title: 6.2.4.1 | Ensure the audit log file directory mode is configured
    exec: 'stat -Lc ''%a'' "$(dirname "$(awk -F= ''/^\s*log_file\s*/{print $2}'' /etc/audit/auditd.conf | xargs)")"'
    exit-status: 0
    stdout:
    - '/^[0-7]?[0-7][0145]0$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
