---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_4_2 }}
command:
  audit_logfile_mode:
    title: 6.2.4.2 | Ensure audit log files mode is configured
    exec: 'find "$(dirname "$(awk -F= ''/^\s*log_file\s*/{print $2}'' /etc/audit/auditd.conf | xargs)")" -maxdepth 1 -type f -perm /0137 | wc -l'
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.2
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
