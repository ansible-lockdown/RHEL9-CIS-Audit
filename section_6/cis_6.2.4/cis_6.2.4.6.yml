---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_2_4_6 }}
command:
  audit_conf_owner:
    title: 6.2.4.6 | Ensure audit configuration files owner is configured
    exec: 'find /etc/audit/ -type f \( -name ''*.conf'' -o -name ''*.rules'' \) ! -user root | wc -l'
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.6
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-9
  {{ end }}
{{ end }}
