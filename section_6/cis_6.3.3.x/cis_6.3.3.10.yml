---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_3_3_10 }}
command:
  auditd_mounts_cnf:
    title: 6.3.3.10 | Ensure successful file system mounts are collected | conf check
    exec: grep mounts /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=(unset|4294967295|-1) -k mounts/'
    - '/-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=(unset|4294967295|-1) -k mounts/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.10
      NIST800-53R5:
      - CM-6
  auditd_mounts_live:
    title: 6.3.3.10 | Ensure successful file system mounts are collected | running
    exec: auditctl -l | grep mounts
    exit-status: 0
    stdout:
    - '/-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=(unset|-1|auid=4294967295) -F key=mounts/'
    - '/-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=(unset|-1|auid=4294967295) -F key=mounts/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.10
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
