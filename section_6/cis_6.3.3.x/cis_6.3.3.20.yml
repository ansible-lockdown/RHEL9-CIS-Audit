---

{{ if .Vars.rhel9cis_level_2 }}
  {{ if .Vars.rhel9cis_rule_6_3_3_20 }}
command:
  auditd_immutable:
    title: 6.3.3.20 | Ensure the audit configuration is immutable
    exec: 'grep "-e 2" /etc/audit/rules.d/*.rules | tail -1'
    exit-status: 0
    stdout:
    - '-e 2'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.20
      NIST800-53R5:
      - AC-3
      - AU-3
      - MP-2
  {{ end }}
{{ end }}
