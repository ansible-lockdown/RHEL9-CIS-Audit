---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_1_1 }}
file:
  cis_7_1_1_passwd:
    title: 7.1.1 | Ensure access to /etc/passwd is configured
    path: /etc/passwd
    exists: true
    owner: root
    group: root
    mode:
      match-regexp: '^0[0246][04][04]$'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.1
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
