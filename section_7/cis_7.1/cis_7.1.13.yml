---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_1_13 }}
    {{ if .Vars.run_heavy_tests }}
command:
  audit_sgid_suid:
    title: 7.1.13 | Ensure SUID and SGID files are reviewed | package ownership and integrity
    exec: |
      findmnt -Dkerno fstype,target,options | awk '($1 !~ /^[[:space:]]*(nfs|proc|smb|vfat|iso9660|efivarfs|selinuxfs)/ && $2 !~ /^\/run\/user\// && $3 !~ /noexec/ && $3 !~ /nosuid/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev -type f \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null
      done | sort -u | while IFS= read -r l_file; do
        echo "reviewed: $l_file"
        if ! rpm -qf "$l_file" >/dev/null 2>&1; then
          echo "FAIL: $l_file is not owned by any package"
        else
          rpm -Vf "$l_file" 2>/dev/null | awk -v f="$l_file" '$NF == f && $1 ~ /(5|M)/ {print "FAIL: " f " differs from its package (" $1 ")"}'
        fi
      done
      echo "scan_done"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^scan_done$/'
    - '/^reviewed: /'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.13
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
