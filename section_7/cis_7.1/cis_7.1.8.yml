---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_1_8 }}
command:
  etc_gshadow-_perms:
    title: 7.1.8 | Ensure access to /etc/gshadow- is configured
    exec: |
      if [ -e /etc/gshadow- ]; then
        find /etc/gshadow- -maxdepth 0 \( -perm /7777 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
        echo "checked_rc=$?"
      else
        echo "not_present"
      fi
    exit-status: 0
    stdout:
    - '/^(checked_rc=0|not_present)$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.8
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
