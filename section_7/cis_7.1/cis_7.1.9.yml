---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_1_9 }}
command:
  etc_shells_perms:
    title: 7.1.9 | Ensure access to /etc/shells is configured
    exec: |
      find /etc/shells -maxdepth 0 \( -perm /7133 -o ! -user root -o ! -group root \) -printf 'FAIL: %p %m %u %g\n'
      echo "checked_rc=$?"
    exit-status: 0
    stdout:
    - '/^checked_rc=0$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.9
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
