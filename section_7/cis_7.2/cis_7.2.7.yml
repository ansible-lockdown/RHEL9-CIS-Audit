---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_2_7 }}
command:
  no_dup_groupname:
    title: 7.2.7 | Ensure no duplicate group names exist
    exec: |
      cut -d: -f1 /etc/group | sort | uniq -d | sed 's/^/FAIL: duplicate group name /'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.7
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
