---

{{ if .Vars.rhel9cis_level_1 }}
  {{ if .Vars.rhel9cis_rule_7_2_8 }}
    {{ if .Vars.run_heavy_tests }}
command:
  home_dirs_configured:
    title: 7.2.8 | Ensure local interactive user home directories are configured
    exec: |
      l_valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' - ))$"
      awk -v pat="$l_valid_shells" -F: '$(NF) ~ pat { print $1 " " $(NF-1) }' /etc/passwd | while read -r l_user l_home; do
        if [ ! -d "$l_home" ]; then
          echo "FAIL: user $l_user home directory $l_home does not exist"
          continue
        fi
        stat -Lc '%U %#a' "$l_home" | while read -r l_own l_mode; do
          [ "$l_own" != "$l_user" ] && echo "FAIL: user $l_user home $l_home is owned by $l_own"
          [ $(( l_mode & 027 )) -gt 0 ] && echo "FAIL: user $l_user home $l_home is mode $l_mode"
        done
      done
      echo "scan_done"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.8
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
    {{ end }}
  {{ end }}
{{ end }}
